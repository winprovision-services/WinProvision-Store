name: Publicar site do WinProvision
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/screenshots/**'
      - 'docs/icons/**'
      - 'docs/visual/*.mp4'
      - 'scripts/build-site.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preparar arquivos públicos
        shell: pwsh
        run: ./scripts/build-site.ps1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
