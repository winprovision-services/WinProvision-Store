name: Publicar versão existente no WinGet
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável já publicada no GitHub
        required: true
        type: string
        default: 0.1.0
      submit:
        description: Enviar ao WinGet após os testes (exige o secret do WinGet Create)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: winget-publication
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  publish:
    name: Validar instalador público e preparar envio
    if: github.repository == 'winprovision-services/WinProvision-Store' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Baixar e conferir instalador publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Informe uma versão estável válida.' }
          New-Item -ItemType Directory -Path artifacts/published-release | Out-Null
          gh release download "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --pattern WinProvision.Store-Setup.exe --pattern release.json --dir artifacts/published-release
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível baixar a release.' }
          $metadata = Get-Content artifacts/published-release/release.json -Raw | ConvertFrom-Json
          $expected = @($metadata.files | Where-Object name -eq 'WinProvision.Store-Setup.exe')
          if ($metadata.version -ne $env:RELEASE_VERSION -or $expected.Count -ne 1 -or (Get-FileHash artifacts/published-release/WinProvision.Store-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[0].sha256) { throw 'O instalador publicado diverge do inventário da release.' }
      - name: Gerar e validar manifestos
        run: .\scripts\winget-release.ps1 -AppVersion $env:RELEASE_VERSION -InstallerPath artifacts/published-release/WinProvision.Store-Setup.exe
      - name: Testar instalação silenciosa, CLI, PATH e remoção
        run: .\scripts\test-release-install.ps1 -AppVersion $env:RELEASE_VERSION -InstallerPath artifacts/published-release/WinProvision.Store-Setup.exe -ManifestPath "artifacts/winget/WinProvision.Store/$env:RELEASE_VERSION"
      - name: Preservar manifestos e relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: winget-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/winget/
            artifacts/winget-install-test.json
            artifacts/winget-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Enviar manifestos com WinGet Create
        if: inputs.submit
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: .\scripts\winget-release.ps1 -AppVersion $env:RELEASE_VERSION -InstallerPath artifacts/published-release/WinProvision.Store-Setup.exe -Submit
